  if(s.id==='BLACK'&&t<108.2){L.fillStyle='#000';L.fillRect(0,0,LW,LH);if(lt>.25)txt('GAME OVER',LW/2,78,'#ff3b3b',4,'c');if(lt>2.3){L.save();L.globalAlpha=Math.min(1,(lt-2.3)*2);txt('1 NEW VOICEMAIL - DAD',LW/2,132,'#fff',1,'c');L.restore()}}

  if(t>=CONT&&t<CONT+.2){L.fillStyle='rgba(255,255,255,.9)';L.fillRect(0,0,LW,LH)}

  const CARDS=[[187.3,191.8,'2024: STARTED AGAIN. SMALLER. HOME BY 6.'],[192.3,196.8,'2038: MAYA GRADUATES.'],[197.3,201.8,'2047: PLAYER 3 HAS JOINED - JUNE']];
  for(const [a,b,sx] of CARDS)if(t>a&&t<b){const al=Math.min(1,(t-a)*4,(b-t)*4);L.save();L.globalAlpha=al;box(Math.round(LW/2-tw(sx)/2-6),186,tw(sx)+12,14,'rgba(8,8,16,.82)','#ff9fd0');txt(sx,LW/2,190,'#fff',1,'c',false);L.restore()}

/* ---------- AUDIO: ElevenLabs score + Dad's ElevenLabs voicemail + light game SFX ---------- */
async function renderAudio(){
  const ac=new OfflineAudioContext(2,Math.ceil(44100*TOTAL),44100),m=ac.createGain();m.gain.value=1;m.connect(ac.destination);
  const nb=ac.createBuffer(1,88200,44100);{const d=nb.getChannelData(0),r=rng(1);for(let i=0;i<d.length;i++)d[i]=r()*2-1}
  const tone=(t,d,f,type,v,slide)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(m);o.start(t);o.stop(t+d+.02)};
  // score, ducked under the voicemail
  const sb=await ac.decodeAudioData(await (await fetch('audio/score-v1.mp3')).arrayBuffer());const ss=ac.createBufferSource();ss.buffer=sb;const sg=ac.createGain();
  {const W=[[VM_AT-1,VM_AT+23.6,.45]].sort((a,b)=>a[0]-b[0]);sg.gain.setValueAtTime(.9,0);
   for(const [a,b,lv] of W){sg.gain.setValueAtTime(.9,a);sg.gain.linearRampToValueAtTime(lv,a+.3);sg.gain.setValueAtTime(lv,b);sg.gain.linearRampToValueAtTime(.9,b+.4)}}ss.connect(sg).connect(m);ss.start(0);
  // rain beds
  tone(106.8,.4,1000,'sine',.05); // voicemail beep (a pure tone, same as a real one)
  // foley: licensed Epidemic Sound recordings (via Higgsfield), audio/sfx
  {// licensed Epidemic Sound recordings. Rain sits on its own; everything else goes through a quiet 'room' bus so it sits inside the picture.
   const ir=ac.createBuffer(2,Math.floor(ac.sampleRate*1.2),ac.sampleRate);{const r=rng(5);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(r()*2-1)*Math.pow(1-i/d.length,3)}}
   const bus=ac.createGain();bus.gain.value=.38;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;const verb=ac.createConvolver();verb.buffer=ir;const wet=ac.createGain();wet.gain.value=.22;
   bus.connect(lp);lp.connect(m);lp.connect(verb);verb.connect(wet).connect(m);
   const FOLEY=[ // [file, start, offset, duration, gain, fadeIn, fadeOut, dest]
     ['coin-hand',18.8,.95,.7,2.4,0,.2],['coin-hand',209.5,.95,.7,2.4,0,.2],
     ['typing-laptop',39.6,0,3.2,.7,.3,.6],['mouse-click',43.4,0,.5,1.6,0,.1],
     ['phone-vibrate',44.2,0,.7,1.0,0,.1],
     ['notification',66.9,0,.8,1.1,0,.2],['notification',68.3,0,.8,1.0,0,.2],['notification',69.6,0,.8,.9,0,.2],
     ['notification',77.5,0,.8,1.1,0,.2],['phone-vibrate',77.3,0,3.3,1.1,0,.2],
     ['applause-small',82.3,0,3.0,2.2,.3,1.3],['applause-hall',176.4,2,10.4,4.2,1.2,2.0],['cheer-outdoor',192.4,3,4.6,3.4,.6,1.2],
     ['hangup-beeps',131.8,0,1.2,1.2,0,.1],['heartbeat',160.3,0,9.6,1.0,.6,.5],
     ['rain-city',49.2,10,11,1.7,.8,1.2,'dry'],['rain-city',93.2,40,11,2.1,.5,1,'dry'],['rain-city',108.2,80,24,.8,1,1,'dry']];
   const cache={};for(const [f,at,off,dur,gain,fi,fo,dest] of FOLEY){const buf=cache[f]=cache[f]||await ac.decodeAudioData(await (await fetch('audio/sfx/'+f+'.mp3')).arrayBuffer());
     let o=off;if(!off){const d=buf.getChannelData(0);let mx=0;for(let i=0;i<d.length;i++)mx=Math.max(mx,Math.abs(d[i]));const th=mx*.08;let i=0;while(i<d.length&&Math.abs(d[i])<th)i++;o=Math.max(0,i/buf.sampleRate-.01)}
     const src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();g.gain.setValueAtTime(fi?0:gain,at);if(fi)g.gain.linearRampToValueAtTime(gain,at+fi);g.gain.setValueAtTime(gain,at+dur-fo);g.gain.linearRampToValueAtTime(0,at+dur);
     src.connect(g).connect(dest==='dry'?m:bus);src.start(at,o,dur+.05)}
   // grave: the same city rain, low, dipping right out under Dad's line
   {const buf=cache['rain-city'];const src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();const A=137.7,B=CONT+1.5;

    g.gain.setValueAtTime(.9,CONT);g.gain.linearRampToValueAtTime(0,B);src.connect(g).connect(m);src.start(A,120,B-A+.1)}
