/* =====================================================================

function wavB64(buf){const nc=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate,data=new DataView(new ArrayBuffer(44+len*nc*2));let p=0;const ws=s=>{for(const c of s)data.setUint8(p++,c.charCodeAt(0))};
  ws('RIFF');data.setUint32(p,36+len*nc*2,true);p+=4;ws('WAVEfmt ');data.setUint32(p,16,true);p+=4;data.setUint16(p,1,true);p+=2;data.setUint16(p,nc,true);p+=2;data.setUint32(p,sr,true);p+=4;data.setUint32(p,sr*nc*2,true);p+=4;data.setUint16(p,nc*2,true);p+=2;data.setUint16(p,16,true);p+=2;ws('data');data.setUint32(p,len*nc*2,true);p+=4;
  const ch=[];for(let c=0;c<nc;c++)ch.push(buf.getChannelData(c));for(let i=0;i<len;i++)for(let c=0;c<nc;c++){const v=Math.max(-1,Math.min(1,ch[c][i]));data.setInt16(p,v*32767,true);p+=2}
  const bytes=new Uint8Array(data.buffer);let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));return btoa(s)}
let AUDIO=null;
async function renderAudio(){if(AUDIO)return AUDIO;const ac=new OfflineAudioContext(2,Math.ceil(44100*(TOTAL+1)),44100);buildAudio(ac);AUDIO=await ac.startRendering();return AUDIO}
window.__renderAudio=async()=>wavB64(await renderAudio());

/* ================= player ================= */
const playB=document.getElementById('play'),seek=document.getElementById('seek'),tm=document.getElementById('tm'),recB=document.getElementById('rec');
let actx=null,src=null,startAt=0,playing=false,cur=0,recDest=null,recorder=null;
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function stopSrc(){if(src){try{src.stop()}catch(e){}src.disconnect();src=null}}
async function play(from){if(!actx){actx=new AudioContext();recDest=actx.createMediaStreamDestination()}await actx.resume();const buf=await renderAudio();stopSrc();src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.connect(recDest);src.start(0,from);startAt=actx.currentTime-from;playing=true;playB.textContent='❚❚ PAUSE';
  src.onended=()=>{if(playing&&actx.currentTime-startAt>=TOTAL-.1){playing=false;playB.textContent='▶ PLAY';if(recorder&&recorder.state==='recording')recorder.stop()}}}
function pause(){cur=actx.currentTime-startAt;stopSrc();playing=false;playB.textContent='▶ PLAY'}
playB.onclick=()=>playing?pause():play(cur>=TOTAL-.2?0:cur);
seek.oninput=()=>{cur=seek.value*TOTAL;if(playing)play(cur);else render(cur)};
document.getElementById('fs').onclick=()=>out.requestFullscreen&&out.requestFullscreen();
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playB.click()}});
recB.onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}await play(0);const st=out.captureStream(30);recDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));const chunks=[];recorder=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',videoBitsPerSecond:12e6});
  recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='continue.webm';a.click();recB.textContent='● REC .WEBM'};recorder.start();recB.textContent='■ STOP REC'};
function loop(){if(window.__manual){requestAnimationFrame(loop);return}if(playing){cur=actx.currentTime-startAt;if(cur>=TOTAL){cur=TOTAL;playing=false;playB.textContent='▶ PLAY'}}render(cur);seek.value=cur/TOTAL;tm.textContent=fmtT(cur)+' / '+fmtT(TOTAL);requestAnimationFrame(loop)}
render(0);renderAudio().then(()=>{playB.textContent='▶ PLAY'});requestAnimationFrame(loop);
</script></body></html>
