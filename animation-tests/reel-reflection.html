<!doctype html>
<html><head><meta charset="utf-8"><title>Reflection</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;max-height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
// "Reflection" — 9:16 surreal short. Raymarched two-world scene + ember particles + synthesized score.
const q = new URLSearchParams(location.search), W = +(q.get('w') || 1080), H = +(q.get('h') || 1920);
const DUR = 31.5, SS = +(q.get('ss') || 1);
const out = document.getElementById('c'); out.width = W; out.height = H;
const ctx = out.getContext('2d');
const gc = document.createElement('canvas'); gc.width = W; gc.height = H;
const gl = gc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });

// ---------------- timing helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eio = u => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const lerp = (a, b, u) => a + (b - a) * u;
const lv = (a, b, u) => a.map((v, i) => lerp(v, b[i], u));
const T_CONTACT = 8.3, C = [0.55, 0.0, 0.17];

// ---------------- poses (2D profile, facing +x; z = side offset) ----------------
const STAND = { hx: -0.02, hy: 0.95, sp: 0.03, hd: 0.0, fN: 0.10, fF: -0.12, aN: [0.06, 0.14], aF: [-0.05, 0.05], reach: 0 };
const CROUCH = { hx: -0.1, hy: 0.44, sp: 1.1, hd: 0.35, fN: 0.16, fF: -0.46, aN: [0.9, 1.2], aF: [0.6, 1.6], reach: 1 };
const mixPose = (a, b, u) => { const o = {}; for (const k in a) o[k] = Array.isArray(a[k]) ? lv(a[k], b[k], u) : lerp(a[k], b[k], u); return o; };
function ik(r, t, l1, l2, s) {
  let dx = t[0] - r[0], dy = t[1] - r[1], d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + 1e-4, l1 + l2 - 1e-4);
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), b = Math.atan2(dy, dx) + s * a;
  const m = [r[0] + l1 * Math.cos(b), r[1] + l1 * Math.sin(b)];
  const e = Math.atan2(t[1] - m[1], t[0] - m[0]);
  return [m, [m[0] + l2 * Math.cos(e), m[1] + l2 * Math.sin(e)]];
}
const LT = 0.46, LS = 0.46, LU = 0.33, LF = 0.31;
function joints(P) {
  const hip = [P.hx, P.hy], dir = [Math.sin(P.sp), Math.cos(P.sp)];
  const neck = [hip[0] + 0.5 * dir[0], hip[1] + 0.5 * dir[1]];
  const chest = [hip[0] + 0.40 * dir[0], hip[1] + 0.40 * dir[1]];
  const sh = [hip[0] + 0.44 * dir[0] - 0.02, hip[1] + 0.44 * dir[1]];
  const ha = P.sp * 0.6 + P.hd;
  const head = [neck[0] + 0.15 * Math.sin(ha), neck[1] + 0.15 * Math.cos(ha)];
  const nose = [head[0] + 0.088 * Math.cos(ha), head[1] - 0.088 * Math.sin(ha) - 0.012];
  const leg = (fx) => { const foot = [fx, 0.065]; const [k] = ik(hip, foot, LT, LS, 1); return [k, foot, [fx + 0.12, 0.035]]; };
  const [kN, ftN, toN] = leg(P.fN), [kF, ftF, toF] = leg(P.fF);
  const fk = (a) => { const e = [sh[0] + LU * Math.sin(a[0]), sh[1] - LU * Math.cos(a[0])]; return [e, [e[0] + LF * Math.sin(a[1]), e[1] - LF * Math.cos(a[1])]]; };
  let [eN, hN] = fk(P.aN); const [eF, hF] = fk(P.aF);
  if (P.reach > 0) { const [ie, ih] = ik(sh, [C[0], 0.05], LU, LF, -1); eN = lv(eN, ie, P.reach); hN = lv(hN, ih, P.reach); }
  const z = (p, zz) => [p[0], p[1], zz];
  return [z(hip, 0), z(neck, 0), z(head, 0), z(nose, 0), z(hip, 0.09), z(kN, 0.09), z(ftN, 0.09), z(toN, 0.09),
    z(hip, -0.09), z(kF, -0.09), z(ftF, -0.09), z(toF, -0.09), z(sh, 0.17), z(eN, 0.17), z(hN, 0.17), z(sh, -0.17), z(eF, -0.17), z(hF, -0.17), z(chest, 0)];
}
// A (top world) and B (mirror world) choreography
function poseA(t) {
  let P = STAND;
  P = mixPose(P, { ...STAND, hd: 0.5 }, eio((t - 2.7) / 0.9));
  P = mixPose(P, CROUCH, eio((t - 4.5) / 3.8));
  P = { ...P, reach: eio((t - 6.3) / 2.0) * (1 - eio((t - 19.6) / 1.2)) };
  if (t > 19.4) P = mixPose(P, { ...STAND, hd: 0.0 }, eio((t - 19.6) / 2.6));
  if (t > 22) P = mixPose(P, { ...STAND, hd: -0.55 }, eio((t - 22.2) / 2.2));
  P.hy += 0.006 * Math.sin(t * 1.7);
  return P;
}
function poseB(t) {
  let P = STAND;
  P = mixPose(P, { ...STAND, hd: 0.5, aN: [0.45, 0.7] }, eio((t - 1.1) / 1.2));   // it moves first
  P = mixPose(P, CROUCH, eio((t - 4.0) / 3.6));
  P = { ...P, reach: eio((t - 5.8) / 2.1) };
  P.hy += 0.006 * Math.sin(t * 1.7 + 0.8);
  return P;
}
const ER0 = 1.25, eroR = t => t < 14.2 ? 9 : ER0 * (1 - clamp((t - 14.2) / 4.8));   // dissolve front (feet first, hand last)
const contactI = t => sm(7.5, 8.3, t) * (0.7 + 2.2 * Math.exp(-Math.max(0, t - 8.3) * 2.2)) * (1 - sm(18.6, 20.5, t));
const mirror = t => sm(20.2, 23.8, t);

// ---------------- camera ----------------
const KT = [0, 9.3, 12.8, 17.6, 21.0, DUR];
const KRO = [[0.15, 0.06, 6.9], [0.25, 0.06, 5.4], [0.3, -0.72, 4.7], [0.3, -0.62, 4.4], [0.2, 1.0, 7.6], [0.2, 1.35, 9.2]];
const KTA = [[0.3, 0.0, 0], [0.32, 0.0, 0], [0.32, -0.85, 0], [0.32, -0.62, 0], [0.1, 2.2, -2], [0.1, 3.3, -2]];
const KRL = [0, 0, Math.PI, Math.PI, 2 * Math.PI, 2 * Math.PI];
function cam(t) {
  if (q.get('pfp')) return camFrom([0, 0.02, +q.get('pfp')], [0, 0.0, 0], 0);   // centred square framing for profile art
  let i = 0; while (i < KT.length - 2 && t > KT[i + 1]) i++;
  const u = eio((t - KT[i]) / (KT[i + 1] - KT[i]));
  return camFrom(lv(KRO[i], KRO[i + 1], u), lv(KTA[i], KTA[i + 1], u), lerp(KRL[i], KRL[i + 1], u));
}
function camFrom(ro, ta, rl) {
  const sub = (a, b) => a.map((v, k) => v - b[k]), nrm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
  const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const ww = nrm(sub(ta, ro)); let uu = nrm(cr(ww, [0, 1, 0])); let vv = cr(uu, ww);
  const c = Math.cos(rl), s = Math.sin(rl);
  const u2 = uu.map((v, k) => c * v + s * vv[k]), v2 = vv.map((v, k) => -s * uu[k] + c * v);
  return { ro, uu: u2, vv: v2, ww };
}

// ---------------- raymarch shader ----------------
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 R, J; uniform float T, ERO, CI, MIR, STARS;
uniform vec3 ro_, uu_, vv_, ww_, C, bAc, bAh, bBc, bBh;
uniform vec3 JA[19]; uniform vec3 JB[19];
out vec4 o;
#define F 1.9
float h1(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float cap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float rcone(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(r1,r2,h); }
float box(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
// Hooded, cloaked silhouette: robe flares from the hips to a pleated hem, sleeves widen at the wrist,
// a hood with a soft peak replaces the face. Legs/arms only show where the cloth would not cover them.
#define FIG(NAME, Jx) float NAME(vec3 p){ \
  vec3 hm = mix((Jx[5]+Jx[9])*.5, (Jx[6]+Jx[10])*.5, .8); hm.z = 0.; \
  vec3 q = p - Jx[0]; float ang = atan(q.z, q.x); \
  float d = rcone(p, Jx[18], Jx[0], .155, .17); \
  float sk = rcone(p, Jx[0], hm, .18, .31) + .014*sin(ang*9. + length(p-hm)*6.) + .01*sin(ang*4.+T*1.3); \
  d = smin(d, sk, .07); \
  d = smin(d, rcone(p, Jx[18], Jx[1], .17, .07), .05); \
  vec3 hp = Jx[2] + normalize(Jx[2]-Jx[3])*.15 - normalize(Jx[2]-Jx[1])*.04; \
  float hood = smin(length(p-Jx[2])-.128, rcone(p, Jx[2], hp, .09, .02), .07); \
  d = smin(d, cap(p, Jx[12], Jx[15], .075), .06); \
  d = smin(d, hood, .05); \
  d = smin(d, rcone(p, Jx[12], Jx[13], .058, .06), .05); d = smin(d, rcone(p, Jx[13], Jx[14]+(Jx[13]-Jx[14])*.18, .06, .078), .02); \
  d = smin(d, rcone(p, Jx[15], Jx[16], .058, .06), .05); d = smin(d, rcone(p, Jx[16], Jx[17]+(Jx[16]-Jx[17])*.18, .06, .078), .02); \
  d = min(d, length(p-Jx[14])-.036); d = min(d, length(p-Jx[17])-.036); \
  d = smin(d, rcone(p, Jx[5], Jx[6], .05, .038), .03); d = smin(d, cap(p, Jx[6], Jx[7], .034), .02); \
  d = smin(d, rcone(p, Jx[9], Jx[10], .05, .038), .03); d = smin(d, cap(p, Jx[10], Jx[11], .034), .02); \
  return d; }
FIG(figA, JA)
FIG(figB, JB)
float worldA(vec3 p){ float b=box(p-bAc,bAh); return b>.3 ? b : figA(p); }
float worldB(vec3 p){
  float b=box(p-bBc,bBh); if(b>.3) return b;
  float d=figB(p);
  if(ERO<5.) d = max(d, length(p-C) - ERO + (n3(p*9.+T*.5)-.5)*.16);
  return d; }
float world(vec3 p, float w){ return w>0. ? worldA(p) : worldB(p); }
vec3 nrm(vec3 p, float w){ const vec2 e=vec2(1,-1)*.0015;
  return normalize(e.xyy*world(p+e.xyy,w)+e.yyx*world(p+e.yyx,w)+e.yxy*world(p+e.yxy,w)+e.xxx*world(p+e.xxx,w)); }
// march inside one world; never crosses the membrane (y=0)
float march(vec3 ro, vec3 rd, float w){
  float tmax = 30.; if(rd.y*w < 0.) tmax = min(tmax, -ro.y/rd.y);
  float t = 0.;
  for(int i=0;i<110;i++){ float h = world(ro+rd*t, w); if(h<.0012) return t; t += h*.9; if(t>tmax) break; }
  return -1.;
}
// ---- skies ----
vec3 skyA(vec3 rd){       // night world
  float y = max(rd.y,0.);
  vec3 c = mix(vec3(.05,.07,.15), vec3(.004,.007,.022), pow(y,.5));
  c += vec3(.10,.12,.22)*exp(-y*14.);
  vec3 md = normalize(vec3(0.,.2,-1.)); float a = acos(clamp(dot(rd,md),-1.,1.)), MR=.14;
  if(a<MR){ vec3 u=normalize(cross(md,vec3(0,1,0))), v=cross(u,md); vec2 m=vec2(dot(rd,u),dot(rd,v))/MR*6.;
    float cr = n3(vec3(m,1.))*.55+n3(vec3(m*2.3,4.))*.3+n3(vec3(m*6.,9.))*.15;
    float limb = sqrt(1.-pow(a/MR,2.));
    c = mix(c, vec3(.9,.92,1.)*(0.62+.45*cr)*(.5+.5*limb)*.72, smoothstep(MR,MR-.003,a)); }
  c += vec3(.3,.4,.75)*exp(-max(a-MR,0.)*10.)*.14;
  vec3 sp = rd*220.; vec3 ci=floor(sp); float hs=h1(ci);
  float th = mix(.992,.975,STARS);
  if(hs>th){ vec3 sc = ci+.5+(vec3(h1(ci+3.),h1(ci+7.),h1(ci+11.))-.5)*.6; float s=exp(-dot(sp-sc,sp-sc)*9.);
    c += s*mix(vec3(.7,.8,1.), vec3(1.,.8,.55), STARS)*(.5+.8*h1(ci+5.))*(.5+.5*sin(T*2.+hs*90.)); }
  return c;
}
vec3 skyB(vec3 rd){       // morning world (its "up" is -y)
  float y = max(-rd.y,0.);
  vec3 c = mix(vec3(.5,.24,.12), vec3(.08,.08,.18), pow(y,.42));
  c += vec3(.8,.4,.2)*exp(-y*10.)*.3;
  vec3 sd = normalize(vec3(0.,-.2,-1.)); float a = acos(clamp(dot(rd,sd),-1.,1.)), SR=.12;
  c = mix(c, vec3(2.2,1.4,.8), smoothstep(SR,SR-.004,a));
  c += vec3(1.,.5,.22)*(exp(-max(a-SR,0.)*9.)*.35 + exp(-max(a-SR,0.)*2.5)*.1);
  return c;
}
vec3 sky(vec3 rd, float w){ return w>0. ? skyA(rd) : skyB(rd); }
// ---- membrane ripples ----
float ht(vec2 x){
  float h = .006*(sin(x.x*2.7+T*1.2)+sin(x.y*2.1-T*.9+x.x*.6)) + .003*sin(x.x*7.+x.y*5.-T*2.);
  float tau = T - ${T_CONTACT.toFixed(2)};
  if(tau>0.){ float r = length(x-C.xz); float front = tau*1.5+.15;
    h += .03*exp(-tau*.35)*exp(-r*.5)*sin(r*16.-tau*8.)*smoothstep(front, front-.4, r); }
  float tb = T - 1.1;   // tiny disturbance when the reflection first moves
  if(tb>0.){ float r = length(x-vec2(.2,.17)); float front=tb*1.2; h += .012*exp(-tb*.8)*sin(r*20.-tb*9.)*smoothstep(front,front-.3,r); }
  return h;
}
vec3 mnorm(vec2 x){ const float e=.01; return normalize(vec3(-(ht(x+vec2(e,0))-ht(x-vec2(e,0)))/(2.*e), 1., -(ht(x+vec2(0,e))-ht(x-vec2(0,e)))/(2.*e))); }
// ---- shading ----
vec3 shadeFig(vec3 p, vec3 rd, float w){
  vec3 n = nrm(p,w);
  vec3 rimC = w>0. ? vec3(.45,.55,.9) : vec3(.9,.55,.3);
  vec3 L = w>0. ? normalize(vec3(0.,.2,-1.)) : normalize(vec3(0.,-.2,-1.));
  float rim = pow(1.-clamp(dot(n,-rd),0.,1.), 6.);
  float back = pow(clamp(dot(n,L)*.5+.5,0.,1.), 4.);
  vec3 c = vec3(.004,.004,.007) + rimC*rim*1.5*(.25+back);
  c += sky(n,w)*.006;
  vec3 lc = C-p; float ld = length(lc);
  c += vec3(1.,.82,.6)*CI*max(dot(n,lc/ld),0.)*.45/(1.+ld*ld*16.);
  if(w<0. && ERO<5.){ float e = smoothstep(.16,0.,abs(length(p-C)-ERO)); c += vec3(1.,.7,.35)*e*2.5; }
  return c;
}
vec3 trace1(vec3 ro, vec3 rd, float w){ float t = march(ro,rd,w); return t<0. ? sky(rd,w) : shadeFig(ro+rd*t,rd,w); }
vec3 glow(vec3 ro, vec3 rd){
  float tc = max(dot(C-ro,rd),0.); float d = length(ro+rd*tc-C);
  return vec3(1.,.78,.5)*CI*(.012/(d*d+.004) + .06*exp(-d*3.));
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  vec2 uv = (2.*(gl_FragCoord.xy+J)-R)/R.y;
  vec3 ro = ro_, rd = normalize(uv.x*uu_ + uv.y*vv_ + F*ww_);
  float w = ro.y >= 0. ? 1. : -1.;
  vec3 col;
  float t = march(ro,rd,w);
  bool hitsPlane = rd.y*w < 0.;
  float tp = hitsPlane ? -ro.y/rd.y : 1e9;
  if(t>0.) col = shadeFig(ro+rd*t,rd,w);
  else if(hitsPlane && tp<60.){
    vec3 p = ro+rd*tp; vec3 n = mnorm(p.xz); if(w<0.) n.y = -n.y;
    float fr = pow(1.-abs(dot(n,rd)),5.);
    vec3 rr;
    float nearK = smoothstep(.05,.8,tp);   // calm the surface right at the lens so crossing it doesn't streak
    n = normalize(mix(vec3(0.,n.y>0.?1.:-1.,0.), n, nearK)); rr = reflect(rd,n);
    vec3 tr = normalize(rd + vec3(n.x,0.,n.z)*1.4);
    float rw = mix(.05+.3*fr, .82, MIR), tw = (1.-MIR)*(.93-.3*fr);
    vec3 refl = trace1(p+n*.002*w, rr, w);
    vec3 tran = tw>.002 ? trace1(p-vec3(0,.002,0)*w, tr, -w) : vec3(0.);
    col = refl*rw + tran*tw;
    // faint luminous membrane line + distance haze toward the horizon
    col += mix(vec3(.15,.2,.35), vec3(.6,.4,.25), .5+.5*n.x)*.04*exp(-tp*.05);
    col = mix(col, w>0. ? vec3(.05,.06,.13) : vec3(.4,.2,.1), 1.-exp(-tp*tp*.0006));
  } else col = sky(rd,w);
  col += glow(ro,rd);
  col = aces(col*.95);
  col = pow(col, vec3(1./2.2));
  vec2 q = gl_FragCoord.xy/R; col *= .55+.45*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),.25);
  o = vec4(col,1.);
}`;

// ---------------- embers / stars (particle pass) ----------------
const PVS = `#version 300 es
precision highp float;
in vec3 s, e; in vec4 r; in float k;
uniform float T, asp, px; uniform vec3 ro_, uu_, vv_, ww_, C;
out vec3 vc; out float va;
float eo(float x){ x=clamp(x,0.,1.); return 1.-pow(1.-x,2.6); }
vec3 bez(vec3 a, vec3 b, vec3 c, vec3 d, float u){ float v=1.-u; return v*v*v*a+3.*v*v*u*b+3.*v*u*u*c+u*u*u*d; }
void main(){
  vec3 p; float a = 0., sz = 1.; vc = vec3(1.,.72,.4);
  if(k < .5){
    // dissolve ember: born when the erosion front passes it, rises through the membrane, settles as a star
    float tb = 14.2 + 4.8*(1. - length(s-C)/1.25) + r.x*.25;
    float D = 3.6 + r.y*1.8, u = (T-tb)/D;
    vec3 P1 = vec3(mix(C.x,s.x,.4), s.y*.25, s.z*.5), P2 = vec3(e.x*.25, e.y*.45+1.2, e.z*.3);
    float ue = eo(u);
    p = bez(s, P1, P2, e, ue);
    p += vec3(sin(T*1.3+r.z*20.), cos(T*1.1+r.w*20.), sin(T*.9+r.x*20.))*.25*sin(3.14159*clamp(u,0.,1.));
    a = step(0.,u) * mix(1.6, .55+.45*sin(T*2.2+r.z*40.), smoothstep(.75,1.,u));
    sz = mix(2.6, 1.5+r.w*1.3, smoothstep(.6,1.,u));
    vc = mix(vec3(1.,.62,.3), vec3(1.,.88,.7), smoothstep(.5,1.,u));
  } else {
    // contact sparks skating out along the membrane
    float tau = T - ${T_CONTACT.toFixed(2)} - r.x*.12;
    float ang = r.y*6.2832, sp = .6 + r.z*1.6;
    p = C + vec3(cos(ang), (r.w-.5)*.25, sin(ang))*sp*(1.-exp(-tau*2.5));
    a = step(0.,tau)*exp(-tau*1.6)*1.8; sz = 1.6;
  }
  vec3 v = p - ro_; float z = dot(v,ww_);
  gl_Position = vec4(dot(v,uu_)*1.9/z/asp, dot(v,vv_)*1.9/z, 0., 1.);
  if(z < .1) gl_Position = vec4(9.,9.,9.,1.);
  gl_PointSize = px*sz*clamp(6./z,.4,3.);
  va = a;
}`;
const PFS = `#version 300 es
precision highp float; in vec3 vc; in float va; out vec4 o;
void main(){ vec2 d=gl_PointCoord-.5; float g=exp(-dot(d,d)*16.); o=vec4(vc*g*va*1.1,1.); }`;

function compile(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
