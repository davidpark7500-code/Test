<!doctype html>
<html><head><meta charset="utf-8"><title>Loop Generator</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;max-height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
// Seamless 9:16 loop generator. Every style is periodic in time: frame(t) == frame(t + DUR).
// URL params: style=ink|chrome|particles  seed=<int>  dur=<seconds>  hook=<text on screen>  w,h
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920), STYLE = q.get('style') || 'ink';
const SEED = +(q.get('seed') || 1), DUR = +(q.get('dur') || 10), HOOK = q.get('hook') || '', SS = +(q.get('ss') || 1);
const out = document.getElementById('c'); out.width = W; out.height = H;
const ctx = out.getContext('2d');
const gc = document.createElement('canvas'); gc.width = W; gc.height = H;
const gl = gc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
let s = SEED * 9301 + 49297; const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 5; i++) R();

// seeded palettes (cosine palette coefficients a,b,c,d) — curated families, then jittered
const FAM = [
  [[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.33,.67]],        // spectral
  [[.5,.4,.45],[.5,.4,.35],[1,1,.5],[.8,.9,.3]],       // ember / rose
  [[.35,.45,.6],[.35,.4,.4],[1,1,1],[.55,.6,.7]],      // moonlight
  [[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.2]],        // sunset
  [[.45,.55,.5],[.4,.45,.5],[.8,1,1],[.3,.2,.2]],      // teal / jade
];
const P = FAM[(R() * FAM.length) | 0].map(v => v.map(x => x + (R() - .5) * .08));

function compile(t, src) { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x);
  if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
function program(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); } return { p, u }; }
const QVS = `#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const COMMON = `#version 300 es
precision highp float;
uniform vec2 R, J; uniform float TH; uniform vec3 PA, PB, PC, PD; uniform vec4 K; out vec4 o;
#define PI 3.14159265
vec3 pal(float t){ return PA + PB*cos(6.28318*(PC*t+PD)); }
float h1(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
`;

// ---------- style: ink (domain-warped noise; time moves on a circle so it loops) ----------
const INK = COMMON + `
// periodic fbm: the 3rd noise axis travels around a circle of radius K.x
float fbm(vec2 p, float ph){
  float a=.5, f=0.;
  for(int i=0;i<6;i++){ vec3 c = vec3(cos(TH+ph), sin(TH+ph), 0.)*K.x; f += a*n3(vec3(p, float(i)*7.3) + vec3(c.x, 0., c.y)); p = rot(.6)*p*2.03; a*=.5; }
  return f; }
void main(){
  vec2 uv = (2.*(gl_FragCoord.xy+J)-R)/R.y * K.y;
  vec2 q = vec2(fbm(uv,0.), fbm(uv+vec2(5.2,1.3),1.7));
  vec2 r = vec2(fbm(uv+3.5*q+vec2(1.7,9.2),2.9), fbm(uv+3.5*q+vec2(8.3,2.8),4.1));
  float f = fbm(uv+3.8*r, 5.3);
  vec3 col = pal(f*1.2 + length(q)*.5 + K.z);
  col *= .04 + 1.5*smoothstep(.3,.95,f) + .35*length(r)*smoothstep(.4,.9,f);
  // relief light from the gradient of f
  float e = .004*K.y; float fx = fbm(uv+3.8*r+vec2(e,0),5.3)-f, fy = fbm(uv+3.8*r+vec2(0,e),5.3)-f;
  vec3 n = normalize(vec3(-fx/e, -fy/e, 3.));
  col *= .7 + .5*max(dot(n, normalize(vec3(-.4,.6,.7))),0.);
  col += pow(max(dot(reflect(normalize(vec3(.4,-.6,-.7)),n), vec3(0,0,1)),0.), 30.)*.25;
  col = pow(aces(col*.85), vec3(1./2.2));
  vec2 v = gl_FragCoord.xy/R; col *= .6+.4*pow(16.*v.x*v.y*(1.-v.x)*(1.-v.y),.2);
  o = vec4(col,1.);
}`;

// ---------- style: chrome (SDF morph between two seeded shapes, studio-lit) ----------
const CHROME = COMMON + `
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float shape(vec3 p, float id){
  if(id<.5){ vec3 q=abs(p)-vec3(.62); return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-.28; }      // rounded cube
  if(id<1.5){ vec2 t=vec2(length(p.xz)-.78,p.y); return length(t)-.32; }                                    // torus
  if(id<2.5){ float sh=abs(length(p)-.95)-.07; vec3 g=p*5.5; return max(sh*.8, (abs(dot(sin(g),cos(g.yzx)))/5.5-.03)*.8); } // gyroid shell
  if(id<3.5){ float d=1e9; for(int i=0;i<6;i++){ float a=float(i)*1.0472+TH; d=smin(d,length(p-vec3(cos(a)*.62,sin(TH*2.+float(i))*.25,sin(a)*.62))-.34,.35);} return d; } // blob ring
  return length(p)-1.0+.08*sin(p.x*7.+TH)*sin(p.y*7.)*sin(p.z*7.-TH);                                       // rippled sphere
}
float map(vec3 p){
  p.xz *= rot(TH); p.xy *= rot(.35*sin(TH));
  p.xz *= rot(p.y*K.w*sin(TH));                     // periodic twist
  float w = .5-.5*cos(TH);                         // 0 -> 1 -> 0 over the loop
  return mix(shape(p,K.x), shape(p,K.y), smoothstep(0.,1.,w))*.8;
}
vec3 nrm(vec3 p){ const vec2 e=vec2(1,-1)*.001; return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
vec3 env(vec3 d){ // procedural studio: two softboxes + coloured floor bounce
  vec3 c = mix(pal(.15)*.03, pal(.25)*.35, smoothstep(-.3,1.,d.y));
  c += 1.8*exp(-pow(length(d.xy-vec2(-.55,.5))*2.2,2.))*(d.z<.2?1.:.3);
  c += 1.1*exp(-pow((d.x-.8)*5.,2.))*smoothstep(-.1,.4,d.y);
  c += mix(vec3(.18), pal(.7)*.3, .4)*smoothstep(0.,-.8,d.y);
  c += .25*exp(-abs(d.y)*14.);
  return c; }
void main(){
  vec2 uv = (2.*(gl_FragCoord.xy+J)-R)/R.y;
  vec3 ro = vec3(0,0,4.0), rd = normalize(vec3(uv, -2.1));
  float t=0.; bool hit=false;
  for(int i=0;i<140;i++){ float h=map(ro+rd*t); if(h<.0006){hit=true;break;} t+=h; if(t>9.) break; }
  vec3 col;
  vec2 v = gl_FragCoord.xy/R;
  vec3 bg = vec3(.006,.007,.01) + mix(vec3(.01), pal(.4)*.05, v.y) + pal(.4)*.07*exp(-length(uv)*1.8);
  if(hit){ vec3 p=ro+rd*t, n=nrm(p); vec3 r=reflect(rd,n); float fr=pow(1.-max(dot(n,-rd),0.),5.);
    vec3 F0 = mix(vec3(.95), pal(.35)*1.1, K.z);
    col = env(r)*(F0+(1.-F0)*fr);
    float ao=0.; for(int i=1;i<5;i++){ float h=.05*float(i); ao+=(h-map(p+n*h)); } col *= clamp(1.-3.*ao,0.,1.);
  } else col = bg;
  col = pow(aces(col), vec3(1./2.2));
  col *= .55+.45*pow(16.*v.x*v.y*(1.-v.x)*(1.-v.y),.22);
  o = vec4(col,1.);
}`;

// ---------- style: particles (periodic two-shape morph) ----------
const PVS = `#version 300 es
precision highp float;
in vec3 a, b; in vec4 r; uniform float TH, asp, px; uniform vec3 PA, PB, PC, PD;
out vec3 vc;
mat3 rY(float t){ float c=cos(t),s=sin(t); return mat3(c,0,-s,0,1,0,s,0,c); }
mat3 rX(float t){ float c=cos(t),s=sin(t); return mat3(1,0,0,0,c,s,0,-s,c); }
vec3 pal(float t){ return PA + PB*cos(6.28318*(PC*t+PD)); }
vec3 flow(vec3 p, float t){ vec3 q=p*1.4; for(int i=0;i<4;i++) q += .32*sin(q.yzx*1.9 + vec3(cos(t),sin(t),cos(t+1.))*1.3 + float(i)*1.7); return q/1.4-p; }
void main(){
  float d = r.x*.9;                                       // per-particle stagger, wraps cleanly
  float ph = TH - d;
  float w = .5-.5*cos(ph);                                // A -> B -> A
  float we = w*w*(3.-2.*w);
  vec3 p = mix(a, b, we);
  p += flow(p + r.xyz*.2, TH) * sin(ph)*sin(ph)*.85;     // swirl only while in flight
  p = rX(.35)*rY(TH)*p*1.35;
  float z = 4. - p.z;
  gl_Position = vec4(p.x*2.1/z/asp, p.y*2.1/z, 0., 1.);
  gl_PointSize = px*(1.+r.z*.9)*5./z;
  vc = pal(r.w*.35 + we*.4 + .1) * (1. + .6*sin(ph)*sin(ph));
}`;
const PFS = `#version 300 es
precision highp float; in vec3 vc; out vec4 o;
void main(){ vec2 d=gl_PointCoord-.5; o=vec4(vc*exp(-dot(d,d)*14.)*.15,1.); }`;

const vaoQ = gl.createVertexArray(); gl.bindVertexArray(vaoQ);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

let prog, K = [0, 0, 0, 0], NP = 0, vaoP;
if (STYLE === 'ink') { prog = program(QVS, INK); K = [0.55 + R() * .5, 1.1 + R() * 1.1, R(), 0]; }
else if (STYLE === 'chrome') {
  prog = program(QVS, CHROME);
  const a = (R() * 5) | 0; let b = (R() * 5) | 0; if (b === a) b = (a + 2) % 5;
  K = [a, b, R() < .5 ? 0 : .8, .6 + R() * .8];
} else {
  prog = program(PVS, PFS);
  NP = 120000;
  const gen = [
    () => { const t = R() * 6.283, p = Math.acos(2 * R() - 1), r = 1.25; return [r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)]; },
    () => { const u = R() * 6.283, P_ = 2 + ((SEED % 2)), Q_ = 3 + ((SEED >> 1) % 3), rr = .14 * Math.sqrt(R()), a2 = R() * 6.283;
      const c = (2 + Math.cos(Q_ * u)) * .45; return [c * Math.cos(P_ * u) + rr * Math.cos(a2), Math.sin(Q_ * u) * .45 + rr * Math.sin(a2), c * Math.sin(P_ * u) + rr * Math.cos(a2 * 1.3)]; },
    () => { const arm = (R() * 3) | 0, rr = Math.pow(R(), .6) * 1.9, a2 = arm * 2.094 + rr * 2.4 + (R() - .5) * .5 / (.4 + rr); return [Math.cos(a2) * rr, (R() - .5) * .06, Math.sin(a2) * rr]; },
    () => { const u = R() * 6.283, v = R() * 6.283; return [(1 + .38 * Math.cos(v)) * Math.cos(u), .38 * Math.sin(v), (1 + .38 * Math.cos(v)) * Math.sin(u)]; },
    () => { const u = R() * 6.283, j = () => (R() - .5) * .07; return [Math.sin(3 * u) * 1.2 + j(), Math.sin(4 * u + .7) * 1.4 + j(), Math.sin(5 * u) * .8 + j()]; },
  ];
  const ia = (R() * gen.length) | 0; let ib = (R() * gen.length) | 0; if (ib === ia) ib = (ia + 1) % gen.length;
  const A = new Float32Array(NP * 3), B = new Float32Array(NP * 3), RN = new Float32Array(NP * 4);
  for (let i = 0; i < NP; i++) { A.set(gen[ia](), i * 3); B.set(gen[ib](), i * 3); for (let c = 0; c < 4; c++) RN[i * 4 + c] = R(); }
  vaoP = gl.createVertexArray(); gl.bindVertexArray(vaoP);
  const att = (n, d, k) => { const bf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bf); gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);
    const l = gl.getAttribLocation(prog.p, n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, k, gl.FLOAT, false, 0, 0); };
  att('a', A, 3); att('b', B, 3); att('r', RN, 4);
}
gl.viewport(0, 0, W, H);
const JIT = [[0, 0], [.5, .5], [.5, 0], [0, .5]].map(([x, y]) => [x - .25, y - .25]);

function hookText() {
  if (!HOOK) return;
  const sc = W / 1080; ctx.save(); ctx.font = `500 ${52 * sc}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 26 * sc; ctx.fillStyle = '#fff';
  const words = HOOK.split(' '), lines = [[]]; for (const w of words) { const L = lines[lines.length - 1]; if (L.length && ctx.measureText([...L, w].join(' ')).width > W * .82) lines.push([w]); else L.push(w); }
  lines.forEach((l, i) => ctx.fillText(l.join(' '), W / 2, H * .14 + (i - (lines.length - 1) / 2) * 66 * sc)); ctx.restore();
}

window.__render = async (t) => {
  const TH = 2 * Math.PI * (((t % DUR) + DUR) % DUR) / DUR;
  gl.useProgram(prog.p); const u = prog.u;
  for (const [k, v] of [['PA', P[0]], ['PB', P[1]], ['PC', P[2]], ['PD', P[3]]]) gl.uniform3fv(u[k], v);
  gl.uniform1f(u.TH, TH);
  if (STYLE === 'particles') {
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindVertexArray(vaoP); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniform1f(u.asp, W / H); gl.uniform1f(u.px, 2.4 * W / 1080);
    const MB = 5, sh = 2 * Math.PI * (0.5 / 30) / DUR;           // motion blur within a 180° shutter
    for (let k = 0; k < MB; k++) { gl.uniform1f(u.TH, TH + (k / (MB - 1) - .5) * sh); gl.drawArrays(gl.POINTS, 0, NP); }
    gl.disable(gl.BLEND);
  } else {
    gl.bindVertexArray(vaoQ); gl.uniform2f(u.R, W, H); gl.uniform4fv(u.K, K); gl.enable(gl.BLEND);
    for (let i = 0; i < SS; i++) { gl.blendFunc(gl.CONSTANT_ALPHA, gl.ONE_MINUS_CONSTANT_ALPHA); gl.blendColor(0, 0, 0, 1 / (i + 1));
      gl.uniform2f(u.J, SS > 1 ? JIT[i][0] : 0, SS > 1 ? JIT[i][1] : 0); gl.drawArrays(gl.TRIANGLES, 0, 3); }
    gl.disable(gl.BLEND);
  }
  gl.finish();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  if (STYLE === 'particles') { const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * .7); g.addColorStop(0, '#0b0e22'); g.addColorStop(1, '#020309'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter'; }
  ctx.drawImage(gc, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `contrast(2) brightness(.6) blur(${16 * W / 1080}px)`; ctx.globalAlpha = .35; ctx.drawImage(gc, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  hookText();
};
document.fonts.load('500 52px Inter').then(() => { window.__ready = true; });
</script></body></html>
