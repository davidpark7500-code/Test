let acc = 0;
const starts = scenes.map(s => { const a = acc; acc += s.dur; return a; });

function fmt(v, dec = 0) {

}

    side(s.left, X0, true, 1.2);
    side(s.right, X0 + w + 40, false, 1.2 + STAG * 4);
    arrive(t, 4.2, () => text(s.pv, X0, 790, { size: 38, weight: 700, color: COL.text, maxW: CW }));
    arrive(t, 5.6, () => text(s.why, X0, 850, { size: 36, color: COL.soft, maxW: 1450, lh: 1.35 }));
  },
  cues: () => [[1.2, 'pop'], [1.76, 'pop'], [4.2, 'tick'], [5.6, 'tick']],
};

S.launch = {
  draw(t, s) {
    bgCream(t); logo(false, false);
    arrive(t, 0.3, () => eyebrow(s.eyebrow, X0, 130, COL.blue));
    arrive(t, 0.44, () => text(s.title, X0, 174, { size: 80, fam: 'serif', color: COL.blue, maxW: CW }));
    const w = (CW - 80) / 3, y = 320, h = 600;
    s.cards.forEach((c, i) => {
      const x = X0 + i * (w + 40);
      arrive(t, 1.2 + i * 1.1, () => {
        card(x, y, w, h);
        badge(c.icon, x + 86, y + 92, 46);
        let yy = y + 178;
        yy += text(c.title, x + 50, yy, { size: 44, fam: 'serif', color: COL.blue, maxW: w - 100, lh: 1.1 }) + 18;
        text(c.text, x + 50, yy, { size: 29, color: COL.text, maxW: w - 100, lh: 1.32 });
        text(c.small, x + 50, y + h - 96, { size: 25, weight: 700, color: COL.soft, maxW: w - 100, lh: 1.3 });
      });
    });
  },
  cues: s => s.cards.map((_, i) => [1.2 + i * 1.1, 'pop']),
};

S.close = {
  draw(t, s) {
    bgDark(t); logo(false, true);
    arrive(t, 0.4, () => eyebrow(s.eyebrow, X0, 250, COL.amber));
    const th = text(s.title, X0, 0, { size: 104, fam: 'serif', maxW: 860, lh: 1.06, dry: true });
    arrive(t, 0.54, () => text(s.title, X0, 296, { size: 104, fam: 'serif', color: COL.card, maxW: 860, lh: 1.06 }));
    const sh = text(s.sub, X0, 0, { size: 38, maxW: 820, lh: 1.35, dry: true });
    arrive(t, 1.4, () => text(s.sub, X0, 296 + th + 34, { size: 38, color: COL.light, maxW: 820, lh: 1.35 }));
    arrive(t, 6.4, () => text(s.cta, X0, 296 + th + 34 + sh + 46, { size: 38, weight: 700, color: COL.amber, maxW: 820, lh: 1.3 }));
    // finish line
    const gy = 880, fx = 1600;
    fade(t, 0.6, () => {
      ctx.fillStyle = 'rgba(213,220,240,0.25)'; ctx.fillRect(1060, gy, 780, 3);
      ctx.fillStyle = COL.light; ctx.fillRect(fx - 150, 400, 10, gy - 400); ctx.fillRect(fx + 140, 400, 10, gy - 400);
      rr(fx - 170, 350, 340, 90, 14); ctx.fillStyle = COL.amber; ctx.fill();
      text(s.finish, fx, 366, { size: 60, fam: 'serif', color: COL.navy, align: 'center' });
    });
    const cross = 5.0, runK = prog(t, 0.8, cross - 0.8);
    const sx = t < cross ? lerp(1120, fx, eIO(runK) * 0.75 + runK * 0.25) : lerp(fx, fx + 60, eOut(prog(t, cross, 1.2)));
    // ribbon
    const br = eOut(prog(t, cross, 0.9));
    ctx.save(); ctx.strokeStyle = COL.amber; ctx.lineWidth = 6; ctx.lineCap = 'round';
    if (br <= 0) { ctx.beginPath(); ctx.moveTo(fx - 140, 700); ctx.quadraticCurveTo(fx, 712, fx + 140, 700); ctx.stroke(); }
    else {
      ctx.beginPath(); ctx.moveTo(fx - 140, 700); ctx.quadraticCurveTo(fx - 100, 720 + 60 * br, fx - 80 + 10 * br, 760 + 110 * br); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx + 140, 700); ctx.quadraticCurveTo(fx + 100, 720 + 60 * br, fx + 80 - 10 * br, 760 + 110 * br); ctx.stroke();
    }
    ctx.restore();
    if (br > 0) for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2 + 0.3, d = 60 + 220 * br;
      circle(fx + Math.cos(a) * d, 620 + Math.sin(a) * d * 0.7 + 120 * br * br, 6 * (1 - br) + 2, `rgba(242,176,69,${0.8 * (1 - br)})`);
    }
    fade(t, 0.6, () => sarah(sx, gy, 0.6, t < cross + 0.8 ? 'run' : 'cheer', t), 0.5);
    // fade to navy at the very end
    const end = prog(t, s.dur - 1.0, 1.0);
    if (end > 0) { ctx.fillStyle = `rgba(29,41,85,${end})`; ctx.fillRect(0, 0, W, H); }
  },
  cues: () => [[0.6, 'whoosh'], [5.0, 'chime'], [6.4, 'pop']],
};

// ── frame ──────────────────────────────────────────────────────────────────
function sceneAt(t) {
  let i = 0; while (i < scenes.length - 1 && t >= starts[i + 1]) i++;
  return i;
}
function drawScene(i, lt) {
  const s = scenes[i], T = S[s.type];
  if (!T) { ctx.fillStyle = '#f00'; ctx.fillRect(0, 0, W, H); return; }
  ctx.save(); T.draw(lt, s); ctx.restore();
}
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = sceneAt(t), lt = t - starts[i];
  if (i > 0 && lt < XF) {
    drawScene(i - 1, scenes[i - 1].dur + lt);
    ctx.save(); ctx.globalAlpha = eIO(lt / XF); drawScene(i, lt); ctx.restore();
  } else drawScene(i, lt);
}
function cues() {
  const out = [];
  scenes.forEach((s, i) => { const T = S[s.type]; if (T && T.cues) for (const [lt, k] of T.cues(s)) out.push([starts[i] + lt, k]); });
  return out;
}

window.ENGINE = {
  W, H, FPS, DUR, starts, scenes, cues,
  init(canvas) { ctx = canvas.getContext('2d'); },
  render,
  ready: () => Promise.all([
    document.fonts.load(`400 40px "DM Serif Display"`), document.fonts.load('400 40px Carlito'), document.fonts.load('700 40px Carlito'),
    ...Object.values(LOGO).map(im => im.decode().catch(() => {})),
  ]).then(() => document.fonts.ready),
};
})();

<script>// Calm music bed + soft sound effects, rendered offline with Web Audio.
// Music follows the story: reflective (chapter 1), brighter from "The Turn".
(() => {
const SR = 44100;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// chords: [bass, pad notes...] (MIDI)
const BRIGHT = [[38, 62, 66, 69, 74], [37, 61, 64, 69, 73], [35, 62, 66, 71, 74], [43, 62, 67, 71, 74]]; // D A/C# Bm G
const REFLECT = [[35, 62, 66, 71, 74], [43, 62, 67, 71, 74], [38, 62, 66, 69, 74], [45, 61, 64, 69, 73]]; // Bm G D A

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

async function renderAudio() {
  const E = window.ENGINE, DUR = E.DUR;
  const ac = new OfflineAudioContext(2, Math.ceil(SR * (DUR + 0.5)), SR);
  const master = ac.createGain(); master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(comp); comp.connect(ac.destination);
  const music = ac.createGain(); music.connect(master);
  music.gain.setValueAtTime(0, 0); music.gain.linearRampToValueAtTime(1, 1.5);
  music.gain.setValueAtTime(1, DUR - 3); music.gain.linearRampToValueAtTime(0, DUR);
  const sfx = ac.createGain(); sfx.gain.value = 0.8; sfx.connect(master);

  // light reverb from a generated impulse
  const rev = ac.createConvolver(); const ir = ac.createBuffer(2, SR * 2.6, SR); const r = rng(7);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
  rev.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.28; rev.connect(revG); revG.connect(master);

  const brightFrom = (() => { const i = E.scenes.findIndex(s => s.type === 'turn'); return i >= 0 ? E.starts[i] : 0; })();
  const BPM = 84, beat = 60 / BPM, bar = beat * 4;

  function pad(f, t0, dur, vol) {
    const g = ac.createGain(); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.3;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 1.0); g.gain.setValueAtTime(vol, t0 + dur - 0.2); g.gain.linearRampToValueAtTime(0, t0 + dur + 1.2);
    for (const det of [-6, 6]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t0); o.stop(t0 + dur + 1.3); }
    lp.connect(g); g.connect(music); g.connect(rev);
  }
  function keys(f, t0, vol) {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0008, t0 + 1.6);
    const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2; const g2 = ac.createGain(); g2.gain.value = 0.18;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(music); g.connect(rev);
    o1.start(t0); o2.start(t0); o1.stop(t0 + 1.7); o2.stop(t0 + 1.7);
  }
  function bass(f, t0, dur, vol) {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.05); g.gain.setTargetAtTime(vol * 0.6, t0 + 0.1, 0.8); g.gain.linearRampToValueAtTime(0, t0 + dur);
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(music); o.start(t0); o.stop(t0 + dur + 0.05);
  }

  let ci = 0;
  for (let t0 = 0; t0 < DUR; t0 += bar, ci++) {
    const bright = t0 >= brightFrom;
    const ch = (bright ? BRIGHT : REFLECT)[ci % 4];
    bass(mtof(ch[0]), t0, bar, 0.13);
    for (const n of ch.slice(1, 4)) pad(mtof(n), t0, bar, 0.018);
    const arp = [ch[1], ch[2], ch[3], ch[4], ch[3] + 12, ch[4], ch[3], ch[2]];
    const step = bright ? beat / 2 : beat;
    for (let k = 0; k * step < bar - 1e-6; k++) {
      const tt = t0 + k * step; if (tt > DUR - 2) break;
      keys(mtof(arp[k % arp.length] + 12), tt, (k % 4 === 0 ? 0.075 : 0.05) * (bright ? 1 : 0.85));
    }
  }

  // sound effects on visual cues
  const noise = ac.createBuffer(1, SR, SR); { const d = noise.getChannelData(0); const rr = rng(3); for (let i = 0; i < d.length; i++) d[i] = rr() * 2 - 1; }
  for (const [t, k] of E.cues()) {
    if (k === 'pop' || k === 'tick') {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      const f0 = k === 'pop' ? 760 : 1500;
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.09);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(k === 'pop' ? 0.11 : 0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.16);
      o.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.2);
    } else if (k === 'chime') {
      for (const [m, v] of [[86, 0.06], [93, 0.035], [98, 0.02]]) {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = mtof(m);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, t + 2.2);
        o.connect(g); g.connect(sfx); g.connect(rev); o.start(t); o.stop(t + 2.3);
      }
    } else if (k === 'whoosh') {
      const s = ac.createBufferSource(); s.buffer = noise; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.6);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07, t + 0.3); g.gain.linearRampToValueAtTime(0, t + 0.75);
      s.connect(bp); bp.connect(g); g.connect(sfx); s.start(t); s.stop(t + 0.8);
    }
  }
  return ac.startRendering();
}

function toWav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, buf.sampleRate, true);
  out.setUint32(28, buf.sampleRate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  return new Uint8Array(out.buffer);
}

window.AUDIO = { renderAudio, toWav };
})();
</script>
<script>
(() => {
const E = window.ENGINE, cv = document.getElementById('c'); E.init(cv);
if (location.search.includes('render')) document.body.classList.add('render');
const seek = document.getElementById('seek'), tm = document.getElementById('time'), pb = document.getElementById('play');
seek.max = E.DUR;
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let t = 0, playing = false, ac = null, buf = null, src = null, t0 = 0, off = 0;
function draw() { E.render(t); seek.value = t; tm.textContent = mmss(t) + ' / ' + mmss(E.DUR); }
async function play() {
  if (!ac) ac = new AudioContext();
  if (!buf) { pb.textContent = '… preparing sound'; buf = await window.AUDIO.renderAudio(); }
  if (t >= E.DUR - 0.05) t = 0;
  src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  off = t; t0 = ac.currentTime; src.start(0, t); playing = true; pb.textContent = '❚❚ Pause'; loop();
}
function pause() { if (src) { try { src.stop(); } catch (e) {} src = null; } playing = false; pb.textContent = '▶ Play'; }
function loop() { if (!playing) return; t = off + (ac.currentTime - t0); if (t >= E.DUR) { t = E.DUR; draw(); pause(); return; } draw(); requestAnimationFrame(loop); }
const toggle = () => playing ? pause() : play();
const jump = v => { const was = playing; pause(); t = Math.max(0, Math.min(E.DUR, v)); draw(); if (was) play(); };
pb.onclick = toggle; cv.onclick = toggle;
seek.oninput = () => jump(parseFloat(seek.value));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') jump(t + (e.shiftKey ? 5 : 1));
  if (e.code === 'ArrowLeft') jump(t - (e.shiftKey ? 5 : 1));
});
// hooks for render.mjs
window.__ready = E.ready().then(() => { draw(); return true; });
window.__render = x => E.render(x);
window.__audioB64 = async () => {
  const b = window.AUDIO.toWav(await window.AUDIO.renderAudio());
  let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
};
})();
