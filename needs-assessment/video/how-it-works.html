<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Needs Assessment: How it works</title>
<style>
  @font-face { font-family: M; src: url(fonts/Montserrat-500.ttf); font-weight: 500; }
  @font-face { font-family: M; src: url(fonts/Montserrat-700.ttf); font-weight: 700; }
  @font-face { font-family: M; src: url(fonts/Montserrat-800.ttf); font-weight: 800; }
  html, body { margin: 0; background: #e6efec; font-family: M, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
  canvas { height: min(86vh, 1200px); aspect-ratio: 9 / 16; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .bar { display: flex; gap: 10px; align-items: center; }
  button { font: 700 14px M, sans-serif; background: #0b0b0b; color: #fff; border: 0; padding: 10px 18px; cursor: pointer; }
  input[type=range] { width: min(60vw, 420px); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="bar"><button id="play">Play</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00</span></div>
</div>
<script src="scenes.js"></script>
<script>
(() => {
  const W = 1080, H = 1920;
  const INK = "#0b0b0b", MINT = "#bde3da", MINT_SOFT = "#eaf6f2", ACCENT = "#2c9a87", MUTED = "#5b6563";
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let D = SCENES.map(estimateDuration);
  const total = () => D.reduce((a, b) => a + b, 0);

  // ---------- helpers ----------
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const appear = (lt, delay, dur = 0.55) => ease((lt - delay) / dur);
  const font = (w, px) => `${w} ${px}px M, sans-serif`;

  function wrap(text, maxW) {
    const words = text.split(" "), lines = [];
    let cur = "";
    for (const w of words) {
      const test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Text block that rises in line by line. A trailing "." is drawn in the accent colour.
  function textBlock(text, x, y, { size, weight = 800, lh = 1.08, maxW = 900, color = INK, lt = 99, delay = 0, accentDot = false, stagger = 0.08 }) {
    ctx.font = font(weight, size);
    ctx.textBaseline = "alphabetic";
    const lines = wrap(text, maxW);
    lines.forEach((ln, i) => {
      const a = appear(lt, delay + i * stagger);
      ctx.globalAlpha *= 1; ctx.save();
      ctx.globalAlpha = ctx.globalAlpha * a;
      const yy = y + i * size * lh + (1 - a) * 40;
      const last = i === lines.length - 1;
      if (accentDot && last && ln.endsWith(".")) {
        const body = ln.slice(0, -1);
        ctx.fillStyle = color; ctx.fillText(body, x, yy);
        ctx.fillStyle = ACCENT; ctx.fillText(".", x + ctx.measureText(body).width, yy);
      } else { ctx.fillStyle = color; ctx.fillText(ln, x, yy); }
      ctx.restore();
    });
    return y + lines.length * size * lh;
  }

  function kicker(text, x, y, lt, delay = 0) {
    ctx.save();
    ctx.globalAlpha *= appear(lt, delay);
    ctx.font = font(700, 32); ctx.letterSpacing = "5px"; ctx.fillStyle = ACCENT;
    ctx.fillText(text.toUpperCase(), x, y);
    ctx.restore();
  }

  function rect(x, y, w, h, fill, stroke, lw = 5) {
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw); }
  }

  // ---------- frame chrome ----------
  function chrome(t, i) {
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    // mint band whose slope eases between scenes
    const s = 300 + Math.sin(t * 0.35) * 30;
    ctx.fillStyle = MINT;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, s - 120); ctx.lineTo(0, s + 120); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, H - 260 - Math.cos(t * 0.3) * 20); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.font = font(800, 34); ctx.fillStyle = INK; ctx.letterSpacing = "0px";
    ctx.fillText("Customer Needs Assessment", 80, 110);
    // progress across the whole video
    const p = (D.slice(0, i).reduce((a, b) => a + b, 0) + (t - D.slice(0, i).reduce((a, b) => a + b, 0))) / total();
    ctx.fillStyle = "rgba(11,11,11,.15)"; ctx.fillRect(80, 140, W - 160, 6);
    ctx.fillStyle = INK; ctx.fillRect(80, 140, (W - 160) * clamp(p), 6);
  }

  function caption(text, lt, dur) {
    const parts = text.split(/(?<=[.!?])\s+/);
    const chars = parts.reduce((a, s) => a + s.length, 0);
    const start = 0.25, span = Math.max(0.5, dur - 0.55);
    let acc = 0, cur = parts[parts.length - 1];
    for (const s of parts) { const end = start + span * ((acc + s.length) / chars); if (lt < end) { cur = s; break; } acc += s.length; }
    ctx.font = font(600, 40);
    const lines = wrap(cur, 860);
    const lh = 54, pad = 30, h = lines.length * lh + pad * 2 - 12, y = 1720 - h;
    ctx.save();
    ctx.globalAlpha = clamp(lt / 0.3) * clamp((dur - lt) / 0.25);
    ctx.fillStyle = INK; ctx.fillRect(80, y, W - 160, h);
    ctx.fillStyle = "#fff";
    lines.forEach((l, k) => ctx.fillText(l, 80 + pad, y + pad + 36 + k * lh));
    ctx.restore();
  }

  function stepHeader(n, lt) {
    kicker(`Step ${n} of 4`, 80, 470, lt);
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = k < n ? INK : "rgba(11,11,11,.15)";
      const a = appear(lt, 0.1 + k * 0.06);
      ctx.fillRect(80 + k * 120, 500, 100 * (k < n ? a : 1), 10);
    }
  }

  function bullets(list, x, y, lt, delay, { size = 56, gap = 96 } = {}) {
    list.forEach((l, k) => {
      const a = appear(lt, delay + k * 0.45);
      ctx.save(); ctx.globalAlpha *= a;
      const yy = y + k * gap + (1 - a) * 30;
      ctx.fillStyle = MINT; ctx.fillRect(x, yy - size * 0.62, 34, 34);
      ctx.fillStyle = INK; ctx.font = font(700, size); ctx.fillText(l, x + 64, yy);
      ctx.restore();
    });
    return y + list.length * gap;
  }

  // ---------- scenes ----------
  function drawScene(s, lt, dur) {
    const X = 80;
    switch (s.kind) {
      case "title": {
        kicker(s.kicker, X, 640, lt);
        const y = textBlock(s.headline, X, 790, { size: 136, lt, delay: 0.15, accentDot: true });
        textBlock(s.sub, X, y + 40, { size: 46, weight: 500, lh: 1.35, color: MUTED, lt, delay: 0.7, maxW: 860 });
        break;
      }
      case "statement": {
        kicker(s.kicker, X, 560, lt);
        const y = textBlock(s.headline, X, 700, { size: 112, lt, delay: 0.1, accentDot: true });
        s.lines.forEach((l, k) => textBlock(l, X, y + 90 + k * 92, { size: 64, weight: 700, lt, delay: 1.4 + k * 0.6 }));
        break;
      }
      case "step": {
        stepHeader(s.step, lt);
        let y = textBlock(s.headline, X, 680, { size: 112, lt, delay: 0.15, accentDot: true });
        if (s.sub) y = textBlock(s.sub, X, y + 30, { size: 44, weight: 500, color: MUTED, lt, delay: 0.6 });
        if (s.lines) y = bullets(s.lines, X, y + 90, lt, 1.0);
        if (s.note) {
          const a = appear(lt, 1.0 + s.lines.length * 0.45 + 0.4);
          ctx.save(); ctx.globalAlpha *= a;
          rect(X, y - 10, W - 160, 96, MINT_SOFT);
          ctx.font = font(600, 36); ctx.fillStyle = INK; ctx.fillText(s.note, X + 30, y + 50);
          ctx.restore();
        }
        if (s.quote) {
          const a = appear(lt, 0.8);
          ctx.save(); ctx.globalAlpha *= a;
          ctx.font = font(600, 50);
          const ql = wrap(`“${s.quote}”`, 820);
          const h = ql.length * 68 + 80;
          rect(X, y + 60 + (1 - a) * 30, W - 160, h, MINT_SOFT);
          ctx.fillStyle = INK; ql.forEach((l, k) => ctx.fillText(l, X + 40, y + 60 + (1 - a) * 30 + 80 + k * 68));
          ctx.restore();
          const b = appear(lt, 2.2);
          ctx.save(); ctx.globalAlpha *= b;
          ctx.font = font(700, 38);
          const tw = ctx.measureText(s.tag).width + 70;
          rect(X, y + h + 110, tw, 84, INK);
          ctx.fillStyle = "#fff"; ctx.fillText(s.tag, X + 35, y + h + 165);
          ctx.restore();
        }
        if (s.card) {
          const a = appear(lt, 0.9);
          ctx.save(); ctx.globalAlpha *= a;
          const cy = y + 80 + (1 - a) * 40;
          rect(X, cy, W - 160, 380, "#fff", INK, 6);
          ctx.fillStyle = MINT; ctx.fillRect(X + 6, cy + 6, W - 172, 80);
          ctx.font = font(700, 32); ctx.letterSpacing = "5px"; ctx.fillStyle = INK; ctx.fillText(s.card.top.toUpperCase(), X + 40, cy + 58);
          ctx.letterSpacing = "0px";
          ctx.font = font(800, 96); ctx.fillText(s.card.big, X + 40, cy + 210);
          ctx.font = font(500, 40); ctx.fillStyle = MUTED;
          wrap(s.card.small, 800).forEach((l, k) => ctx.fillText(l, X + 40, cy + 285 + k * 52));
          ctx.restore();
        }
        break;
      }
      case "winwin": {
        kicker(s.kicker, X, 560, lt);
        const y = textBlock(s.headline, X, 700, { size: 112, lt, delay: 0.1, accentDot: true });
        [s.left, s.right].forEach((c, k) => {
          const a = appear(lt, 1.2 + k * 1.4);
          ctx.save(); ctx.globalAlpha *= a;
          const by = y + 70 + k * 300 + (1 - a) * 40;
          rect(X, by, W - 160, 240, k ? INK : MINT);
          ctx.fillStyle = k ? "#fff" : INK;
          ctx.font = font(800, 64); ctx.fillText(c.title, X + 44, by + 100);
          ctx.font = font(500, 42); ctx.fillText(c.text, X + 44, by + 170);
          ctx.restore();
        });
        const p = appear(lt, 2.9);
        ctx.save(); ctx.globalAlpha *= p;
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(W / 2, y + 70 + 270, 46, 0, 7); ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
        ctx.font = font(800, 60); ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.fillText("+", W / 2, y + 70 + 291); ctx.textAlign = "left";
        ctx.restore();
        break;
      }
      case "network": {
        kicker(s.kicker, X, 560, lt);
        const y = textBlock(s.headline, X, 700, { size: 112, lt, delay: 0.1, accentDot: true });
        const cx = W / 2, top = y + 90;
        const you = [cx, top], client = [cx, top + 205];
        const friends = [[cx - 300, top + 380], [cx, top + 400], [cx + 300, top + 380]];
        const line = (a, b, p) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p); ctx.stroke(); };
        ctx.lineWidth = 6; ctx.strokeStyle = INK;
        line(you, client, appear(lt, 1.0, 0.7));
        friends.forEach((f, k) => line(client, f, appear(lt, 2.4 + k * 0.3, 0.6)));
        const node = (p, r, fill, label, a, color) => {
          ctx.save(); ctx.globalAlpha *= a;
          ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p[0], p[1], r * (0.6 + 0.4 * a), 0, 7); ctx.fill();
          ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
          ctx.font = font(800, r > 70 ? 40 : 30); ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(label, p[0], p[1] + 12); ctx.textAlign = "left";
          ctx.restore();
        };
        node(you, 84, INK, "You", appear(lt, 0.6), "#fff");
        node(client, 84, MINT, "Client", appear(lt, 1.5), INK);
        friends.forEach((f, k) => node(f, 62, "#fff", "Friend", appear(lt, 2.8 + k * 0.3), INK));
        break;
      }
      case "close": {
        s.lines.forEach((l, k) => textBlock(l, X, 760 + k * 170, { size: 120, lt, delay: 0.2 + k * 1.1, accentDot: true }));
        const a = appear(lt, 3.6);
        ctx.save(); ctx.globalAlpha *= a;
        ctx.font = font(700, 36); ctx.letterSpacing = "4px"; ctx.fillStyle = ACCENT;
        ctx.fillText(s.footer.toUpperCase(), X, 1360);
        ctx.restore();
        break;
      }
    }
  }

  function render(t) {
    let i = 0, start = 0;
    while (i < SCENES.length - 1 && t >= start + D[i]) { start += D[i]; i++; }
    const lt = t - start, dur = D[i];
    chrome(t, i);
    ctx.save();
    // fade out the end of each scene (except the last)
    const out = i < SCENES.length - 1 ? clamp((dur - lt) / 0.35) : 1;
    ctx.globalAlpha = out;
    ctx.translate(0, (1 - out) * -30);
    drawScene(SCENES[i], lt, dur);
    ctx.restore();
    if (window.__captions !== false) caption(SCENES[i].narration, lt, dur);
  }

  // ---------- hooks for render.js ----------
  window.__render = render;
  window.__setDurations = (arr) => { D = arr.slice(); };
  window.__total = total;
  window.__ready = document.fonts.load("800 40px M").then(() => document.fonts.load("500 40px M")).then(() => document.fonts.load("700 40px M"));

  // ---------- in-browser preview player ----------
  const play = document.getElementById("play"), seek = document.getElementById("seek"), time = document.getElementById("time");
  let playing = false, t0 = 0, at = 0;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function tick(now) {
    if (playing) { at = (now - t0) / 1000; if (at >= total()) { at = total(); playing = false; play.textContent = "Replay"; } }
    render(Math.min(at, total() - 0.001));
    seek.value = (at / total()) * 1000; time.textContent = fmt(at);
    requestAnimationFrame(tick);
  }
  play.onclick = () => { if (at >= total()) at = 0; playing = !playing; play.textContent = playing ? "Pause" : "Play"; t0 = performance.now() - at * 1000; };
  seek.oninput = () => { at = (seek.value / 1000) * total(); t0 = performance.now() - at * 1000; };
  // The preview player is off during export (render.js loads ?export).
  if (!location.search.includes("export")) window.__ready.then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
